name: Recipe Smoke Tests

on:
  push:
    branches: [ master, feat/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test thin npm recipes
        run: |
          chmod +x scripts/smoke-test-recipes.sh
          bash scripts/smoke-test-recipes.sh
